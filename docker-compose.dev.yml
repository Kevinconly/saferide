version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: saferide_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  api:
    build:
      context: .
      dockerfile: apps/saferide-backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/saferide_dev
      REDIS_URL: redis://redis:6379
    depends_on:
      - postgres
      - redis
volumes:
  pgdata:
