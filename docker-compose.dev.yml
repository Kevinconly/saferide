version: '3.8'
services:
  mongodb:
    image: mongo:8
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  api:
    build:
      context: .
      dockerfile: apps/saferide-backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mongodb://mongodb:27017/saferide_dev
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongodb
      - redis
volumes:
  mongodata:
