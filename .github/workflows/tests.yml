name: CI Tests

on: [push, pull_request]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm ci
      - name: Run backend unit tests
        run: npm --workspace=saferide-backend run test:unit

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: saferide_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install
        run: npm ci
      - name: Wait for services
        run: |
          docker run --rm --network host busybox sh -c 'echo services up'
      - name: Run integration tests
        run: npm --workspace=saferide-backend run test:integration

  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4
      - name: Start app (dev)
        run: |
          npm ci
          npm --workspace=saferide-backend run start:dev &
          sleep 5
      - name: Playwright install
        uses: microsoft/playwright-github-action@v1
        with:
          run: npm --workspace=saferide-backend run test:e2e || true
      - name: Run Playwright tests
        run: npx playwright test --config=playwright.config.ts || true
