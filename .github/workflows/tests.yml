name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mongodb://localhost:27017/saferide_test?directConnection=true
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_TOKEN_SECRET: ci-access-secret
      JWT_REFRESH_TOKEN_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npm --workspace=saferide-backend run prisma:generate
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm --workspace=saferide-backend run lint
      - name: Unit tests
        run: npm --workspace=saferide-backend run test:unit

  integration-tests:
    runs-on: ubuntu-latest
    needs: checks
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ ping: 1 })'" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: mongodb://localhost:27017/saferide_test?directConnection=true
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_TOKEN_SECRET: ci-access-secret
      JWT_REFRESH_TOKEN_SECRET: ci-refresh-secret
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npm --workspace=saferide-backend run prisma:generate
      - name: Apply migrations
        run: npx --prefix apps/saferide-backend prisma db push --accept-data-loss
        env:
          DATABASE_URL: mongodb://localhost:27017/saferide_test?directConnection=true
      - name: Integration tests
        run: npm --workspace=saferide-backend run test:integration

  e2e-tests:
    runs-on: ubuntu-latest
    needs: integration-tests
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: saferide_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      PORT: 3000
      DATABASE_URL: mongodb://localhost:27017/saferide_dev?directConnection=true
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_TOKEN_SECRET: ci-access-secret
      JWT_REFRESH_TOKEN_SECRET: ci-refresh-secret
      SMS_MOCK: "true"
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install
        run: npm ci
      - name: Generate Prisma client
        run: npm --workspace=saferide-backend run prisma:generate
      - name: Apply migrations
        run: npx --prefix apps/saferide-backend prisma db push --accept-data-loss
        env:
          DATABASE_URL: mongodb://localhost:27017/saferide_dev?directConnection=true
      - name: Build backend
        run: npm --workspace=saferide-backend run build
      - name: Start backend
        run: |
          node apps/saferide-backend/dist/main.js &
          sleep 8
        env:
          PORT: 3000
          DATABASE_URL: mongodb://localhost:27017/saferide_dev?directConnection=true
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_TOKEN_SECRET: ci-access-secret
          JWT_REFRESH_TOKEN_SECRET: ci-refresh-secret
          SMS_MOCK: "true"
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run Playwright tests
        run: npx playwright test --config=playwright.config.ts
